# Quick checks on every push and pull request: the code compiles, the CLI runs,
# and the desktop app starts headless and finds ffmpeg, Deno and the YouTube solver.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Qt's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q src packaging

      - name: Command line starts
        run: python src/ytdl_cli.py --help

      - name: Desktop app starts and finds its tools
        env:
          QT_QPA_PLATFORM: offscreen
        run: python src/ytdl_gui.py --smoke-test
