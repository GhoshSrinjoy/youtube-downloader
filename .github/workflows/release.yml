# Builds the desktop app for Windows, macOS (Apple Silicon + Intel) and Linux.
# Push a tag like v2.0.0 to publish a GitHub release with all downloads attached;
# "Run workflow" on the Actions tab only builds them (artifacts on the run page).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS Apple Silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
          - name: Linux x86_64
            os: ubuntu-22.04  # oldest supported glibc = widest compatibility
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import ytdl; print(ytdl.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ = $version in src/ytdl/__init__.py"
            exit 1
          fi

      - name: Build, smoke-test and package
        run: python packaging/build.py

      - uses: actions/upload-artifact@v7
        with:
          name: ytdl-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum * | tee SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | Download |
            |---|---|
            | **Windows 10/11** (64-bit) | [Installer](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/YTDL-Windows-x64-Setup.exe) · [Portable .zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/YTDL-Windows-x64-Portable.zip) |
            | **macOS 14+** Apple Silicon | [YTDL-macOS-AppleSilicon.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/YTDL-macOS-AppleSilicon.dmg) |
            | **macOS 14+** Intel | [YTDL-macOS-Intel.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/YTDL-macOS-Intel.dmg) |
            | **Linux** (glibc 2.35+) | [AppImage](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/YTDL-Linux-x86_64.AppImage) · [.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/YTDL-Linux-x86_64.tar.gz) |

            Everything is bundled (yt-dlp, FFmpeg, Deno), so there is nothing else to install.
            First launch: Windows SmartScreen → *More info → Run anyway*; macOS → right-click the app → *Open*
            (or run `xattr -dr com.apple.quarantine /Applications/YTDL.app`); Linux → `chmod +x` the AppImage.
